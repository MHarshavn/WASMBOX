
name: Developer portal

on:
  push:
    branches: [main, feature/issue-5-developer-portal]
    paths: ['frontend/**', '.github/workflows/frontend.yml']
  pull_request:
    paths: ['frontend/**', '.github/workflows/frontend.yml']

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run format:check

      - run: npm test

      - run: npm run build

      - name: Configure APT network retries
        run: |
          echo 'Acquire::Retries "3";' | sudo tee /etc/apt/apt.conf.d/80-retries
          echo 'Acquire::http::Timeout "30";' | sudo tee -a /etc/apt/apt.conf.d/80-retries
          echo 'Acquire::https::Timeout "30";' | sudo tee -a /etc/apt/apt.conf.d/80-retries

      - name: Install Playwright Chromium
        run: |
          for attempt in 1 2 3; do
            echo "Playwright installation attempt $attempt"
            if npx playwright install --with-deps chromium; then
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "Installation failed. Retrying in 20 seconds..."
              sleep 20
            fi
          done

          echo "Playwright installation failed after 3 attempts."
          exit 1

      - name: Run Playwright E2E tests
        run: npm run test:e2e

      - run: npm audit --audit-level=high
